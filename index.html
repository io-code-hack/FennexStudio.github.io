
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">

<title>Fennex Studio</title>
<meta name="description" content="Aplicaciones y juegos desarrollados por Fennex Studio.">

<link rel="icon" href="imagen/logo.png">

<style>
:root {
  --bg: #080808;
  --surface: #111111;
  --surface-hover: #171717;
  --border: #252525;
  --red: #e51b27;
  --text: #f4f4f4;
  --muted: #858585;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}

.container {
  width: min(100% - 32px, 850px);
  margin: auto;
}

/* HEADER */

header {
  padding: 30px 0 22px;
  text-align: center;
}

.logo {
  width: 190px;
  max-width: 65%;
  height: auto;
  display: block;
  margin: auto;
}

/* INTRODUCCIÓN */

.intro {
  text-align: center;
  margin: 10px 0 32px;
}

.intro h1 {
  font-size: 1.55rem;
  font-weight: 750;
  letter-spacing: -0.7px;
}

.intro p {
  color: var(--muted);
  font-size: .85rem;
  margin-top: 4px;
}

/* SECCIÓN */

.section-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.section-title h2 {
  font-size: .95rem;
  font-weight: 700;
}

.section-title span {
  height: 1px;
  flex: 1;
  background: var(--border);
}

/* PROYECTOS */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  gap: 12px;
  padding-bottom: 45px;
}

.project {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  transition: border-color .2s, background .2s, transform .2s;
}

.project:hover {
  background: var(--surface-hover);
  border-color: #484848;
  transform: translateY(-2px);
}

/* INFORMACIÓN */

.project-header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.app-icon {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 12px;
  background: #202020;
  display: grid;
  place-items: center;
  font-size: 1.3rem;
  font-weight: bold;
  color: var(--red);
}

.project-info {
  min-width: 0;
}

.project-info h3 {
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.3;
}

.type {
  display: inline-block;
  color: #ff6870;
  font-size: .7rem;
  margin-top: 3px;
}

.description {
  color: #a0a0a0;
  font-size: .82rem;
  line-height: 1.55;
}

/* DATOS */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  padding: 10px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.stat {
  text-align: center;
  min-width: 0;
}

.stat + .stat {
  border-left: 1px solid var(--border);
}

.stat small {
  display: block;
  color: var(--muted);
  font-size: .68rem;
}

.stat strong {
  display: block;
  font-size: .79rem;
  font-weight: 650;
  overflow-wrap: anywhere;
}

/* DESCARGA */

.download {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  background: var(--red);
  color: white;
  text-decoration: none;
  font-size: .83rem;
  font-weight: 700;
  padding: 10px;
  border-radius: 6px;
  transition: background .2s;
}

.download:hover {
  background: #ff303b;
}

.download:active {
  transform: scale(.98);
}

.download:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.download svg {
  width: 16px;
  height: 16px;
}

/* PIE DE PÁGINA */

footer {
  border-top: 1px solid var(--border);
  padding: 20px 0;
  text-align: center;
  color: var(--muted);
  font-size: .75rem;
}

footer strong {
  color: #ccc;
  font-weight: 600;
}

/* MÓVILES */

@media (max-width: 480px) {
  header {
    padding-top: 24px;
  }

  .intro {
    margin-bottom: 26px;
  }

  .intro h1 {
    font-size: 1.35rem;
  }

  .project {
    padding: 13px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <img
      class="logo"
      src="imagen/logo.png"
      alt="Fennex Studio"
    >
  </div>
</header>

<main class="container">

  <section class="intro">
    <h1>Aplicaciones y juegos</h1>
    <p>Explora nuestros proyectos y descárgalos.</p>
  </section>

  <div class="section-title">
    <h2>PROYECTOS</h2>
    <span></span>
  </div>

  <section class="grid" id="proyectos">
    <noscript>Activa JavaScript para visualizar los proyectos.</noscript>
  </section>

</main>

<footer>
  <div class="container">
    © <span id="anio"></span> <strong>Fennex Studio</strong>
    · Todos los derechos reservados.
  </div>
</footer>

<script>

/* =====================================
   LISTA DE PROYECTOS
   ===================================== */

const proyectos = [
  {
    nombre: "Touch Challenge",
    tipo: "Juego",
    descripcion: "Pon a prueba tus reflejos. Toca la pantalla lo más rápido posible y supera tu propio récord.",
    apk: "apk/TouchChallenge.apk",
    icono: "imagen/apk logo touchchallenge.png",
    peso: "25 MB",
    plataforma: "Android",
    version: "1.0"
  }

  // Para añadir otro proyecto, copia un bloque:
  /*
  ,
  {
    nombre: "Nombre",
    tipo: "Aplicación",
    descripcion: "Descripción del proyecto.",
    apk: "apk/Nombre.apk",
    icono: "imagen/nombre.png",
    peso: "10 MB",
    plataforma: "Android",
    version: "1.0"
  }
  */
];

/* =====================================
   GENERADOR DE TARJETAS
   ===================================== */

const contenedor = document.getElementById("proyectos");

function crearElemento(tag, clase, texto) {
  const elemento = document.createElement(tag);

  if (clase) elemento.className = clase;
  if (texto !== undefined) elemento.textContent = texto;

  return elemento;
}

proyectos.forEach(p => {

  const tarjeta = crearElemento("article", "project");

  // Encabezado
  const encabezado = crearElemento("div", "project-header");

  const icono = crearElemento("img", "app-icon");
  icono.src = p.icono;
  icono.alt = "Icono de " + p.nombre;
  icono.loading = "lazy";

  icono.onerror = () => {
    const fallback = crearElemento(
      "div",
      "app-icon",
      p.nombre.charAt(0).toUpperCase()
    );

    icono.replaceWith(fallback);
  };

  const informacion = crearElemento("div", "project-info");

  const nombre = crearElemento("h3", "", p.nombre);
  const tipo = crearElemento("span", "type", p.tipo);

  informacion.append(nombre, tipo);
  encabezado.append(icono, informacion);

  // Descripción
  const descripcion = crearElemento(
    "p",
    "description",
    p.descripcion
  );

  // Estadísticas
  const estadisticas = crearElemento("div", "stats");

  [
    ["Tamaño", p.peso],
    ["Sistema", p.plataforma],
    ["Versión", p.version]
  ].forEach(([titulo, valor]) => {

    const stat = crearElemento("div", "stat");

    stat.append(
      crearElemento("small", "", titulo),
      crearElemento("strong", "", valor)
    );

    estadisticas.append(stat);
  });

  // Botón de descarga
  const boton = crearElemento("a", "download", "Descargar");

  boton.href = p.apk;
  boton.setAttribute("download", "");

  boton.innerHTML = `
    <svg viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="m7 10 5 5 5-5"/>
      <path d="M12 15V3"/>
    </svg>
    Descargar APK
  `;

  tarjeta.append(
    encabezado,
    descripcion,
    estadisticas,
    boton
  );

  contenedor.append(tarjeta);

});

// Año automático
document.getElementById("anio").textContent =
  new Date().getFullYear();

</script>

</body>
</html>
