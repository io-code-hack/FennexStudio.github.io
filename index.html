!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fennex Studio · Apps y juegos</title>
<meta name="description" content="Descarga las aplicaciones y juegos de Fennex Studio.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="imagen/logo.png">
<style>
  :root{
    color-scheme: dark;
    --bg:#000;
    --card:#0f0f0f;
    --line:#2b2b2b;
    --red:#e5121b;
    --red-hi:#ff3038;
    --text:#f7f7f7;
    --muted:#a6a6a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 18px}

  /* Cabecera con logo */
  header{padding:28px 0 8px;text-align:center}
  header img{
    display:block;
    margin:0 auto;
    width:min(100%,380px);
    height:auto;
  }

  /* Título de sección */
  .titulo{
    display:flex;
    align-items:center;
    gap:14px;
    margin:26px 0 20px;
  }
  .titulo h2{font-size:1.35rem;font-weight:700;letter-spacing:.2px}
  .titulo::after{content:"";flex:1;height:2px;background:var(--red)}

  /* Bloques */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:18px;
    padding-bottom:40px;
  }
  .bloque{
    display:flex;
    flex-direction:column;
    gap:16px;
    padding:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--red);
    border-radius:6px;
  }
  .cabecera{display:flex;gap:14px;align-items:center}
  .icono{
    flex:none;
    width:72px;height:72px;
    border-radius:16px;
    background:#1b1b1b;
    object-fit:cover;
    display:grid;place-items:center;
    font-size:1.8rem;font-weight:700;color:var(--red);
  }
  .cabecera h3{font-size:1.15rem;line-height:1.25}
  .tipo{
    display:inline-block;
    margin-top:4px;
    padding:1px 9px;
    border:1px solid var(--red);
    border-radius:99px;
    color:var(--red-hi);
    font-size:.78rem;
  }
  .desc{color:var(--muted);font-size:.95rem}

  /* Estadísticas */
  dl.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  dl.stats div{padding:10px 6px;text-align:center}
  dl.stats div + div{border-left:1px solid var(--line)}
  dl.stats dt{font-size:.75rem;color:var(--muted)}
  dl.stats dd{font-size:.98rem;font-weight:700}

  /* Botón de descarga */
  .descargar{
    display:block;
    padding:12px 16px;
    background:var(--red);
    color:#fff;
    font-weight:700;
    text-align:center;
    text-decoration:none;
    border-radius:6px;
    transition:background .15s;
  }
  .descargar:hover{background:var(--red-hi)}
  .descargar:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .ruta{font-size:.78rem;color:var(--muted);text-align:center;word-break:break-all}

  footer{
    padding:22px 0 34px;
    border-top:1px solid var(--line);
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <img src="imagen/logo.png" alt="Fennex Studio">
  </div>
</header>

<main class="wrap">
  <div class="titulo"><h2>Proyectos</h2></div>
  <div class="grid" id="proyectos">
    <noscript>Activa JavaScript para ver la lista de proyectos.</noscript>
  </div>
</main>

<footer>
  <div class="wrap">© <span id="anio"></span> Fennex Studio</div>
</footer>

<script>
  /* ==========================================================
     LISTA DE PROYECTOS
     Para añadir uno nuevo, copia un bloque { ... }, ponle una
     coma al anterior y cambia los datos.
     ========================================================== */
  const proyectos = [
    {
      nombre: "Touch Challenge",
      tipo: "Juego",
      descripcion: "Pon a prueba tus reflejos: toca la pantalla lo más rápido que puedas y supera tu récord.",
      apk: "apk/TouchChallenge.apk",
      icono: "imagen/apk logo touchchallenge.png",
      peso: "25 MB",
      plataforma: "Android",
      version: "1.0"
    }
    /* , { nombre: "Otro proyecto", tipo: "App", descripcion: "...", apk: "apk/Otro.apk", icono: "imagen/otro.png", peso: "10 MB", plataforma: "Android", version: "1.0" } */
  ];

  const contenedor = document.getElementById("proyectos");

  function el(tag, clase, texto) {
    const e = document.createElement(tag);
    if (clase) e.className = clase;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }

  proyectos.forEach(p => {
    const bloque = el("article", "bloque");

    /* Icono + nombre + tipo */
    const cab = el("div", "cabecera");
    const img = el("img", "icono");
    img.src = encodeURI(p.icono);   // permite espacios en el nombre del archivo
    img.alt = "Icono de " + p.nombre;
    img.loading = "lazy";
    img.onerror = () => {           // si la imagen no carga, muestra la inicial
      const letra = el("div", "icono", p.nombre.charAt(0));
      img.replaceWith(letra);
    };
    const info = el("div");
    info.append(el("h3", "", p.nombre), el("span", "tipo", p.tipo));
    cab.append(img, info);

    /* Descripción */
    const desc = el("p", "desc", p.descripcion);

    /* Estadísticas */
    const stats = el("dl", "stats");
    [["Peso", p.peso], ["Plataforma", p.plataforma], ["Versión", p.version]].forEach(([k, v]) => {
      const fila = el("div");
      fila.append(el("dt", "", k), el("dd", "", v));
      stats.append(fila);
    });

    /* Descarga */
    const a = el("a", "descargar", "Descargar APK");
    a.href = encodeURI(p.apk);
    a.setAttribute("download", "");
    const ruta = el("div", "ruta", p.apk);

    bloque.append(cab, desc, stats, a, ruta);
    contenedor.append(bloque);
  });

  document.getElementById("anio").textContent = new Date().getFullYear();
</script>
</body>
</html>
